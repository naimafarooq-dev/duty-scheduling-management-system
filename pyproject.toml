[project]
name = "django-projects"
version = "0.1.0"
description = "django project with poetry"
authors = [
    {name = "NLC"}
]
license = {text = "\"MIT\""}
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "django (>=5.2.4,<6.0.0)",
    "PyMySQL (>=1.1.1,<2.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "reportlab (==5.0.1)",
    "python-docx (==1.2.0)"
]

[tool.poetry]
packages = [
    { include = "myproject" }
]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"