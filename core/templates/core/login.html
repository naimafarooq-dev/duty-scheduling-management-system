{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty Roaster | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(
            to bottom,
            #ffffff 0%,
            #fff6e5 30%,
            #fcd34d 70%,
            #f97316 100%
        );
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    .login-box {
        width: 100%;
        max-width: 420px;
        padding: 45px 35px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        backdrop-filter: blur(4px);
    }

    .login-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .logo {
        display: block;
        margin: 0 auto 30px;
        width: 130px;
        height: auto;
        border-radius: 12px;
        object-fit: contain;
        background-color: #ffffff;
        padding: 10px 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        transition:
            transform 0.3s ease-in-out,
            box-shadow 0.3s ease-in-out;
        filter: grayscale(0.2) contrast(1.05) brightness(1.1);
    }

    .logo:hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
        filter: grayscale(0) contrast(1.1) brightness(1.15);
    }

    .form-title {
        font-weight: 700;
        font-size: 1.6rem;
        color: #343a40;
        text-align: center;
        margin-bottom: 28px;
        letter-spacing: 0.5px;
    }

    .form-control {
        border-radius: 10px;
        border: 1px solid #ced4da;
        padding: 12px 14px;
        font-size: 0.95rem;
        transition:
            border-color 0.3s ease,
            box-shadow 0.3s ease;
    }

    .form-control:focus {
        border-color: #f97316;
        box-shadow: 0 0 6px rgba(249, 115, 22, 0.4);
        outline: none;
    }

    .btn-custom {
        background-color: #ec913c;
        border: none;
        color: #fff;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        transition:
            background-color 0.3s ease,
            transform 0.2s ease;
        letter-spacing: 0.3px;
    }

    .btn-custom:hover {
        background-color: #d65b0f;
        transform: scale(1.03);
    }

    .alert {
        font-size: 14px;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    label {
        font-weight: 600;
        color: #343a40;
        margin-bottom: 6px;
    }

    .form-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: #6c757d;
    }

    .form-footer a {
        color: #f97316;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
    }

    .form-footer a:hover {
        text-decoration: underline;
        color: #d65b0f;
    }

    /* Demo Credentials */

    .demo-credentials {
        margin-top: 22px;
        padding: 14px 16px;
        background-color: #fff8ed;
        border: 1px solid #fcd34d;
        border-radius: 10px;
        text-align: center;
        color: #495057;
        font-size: 0.9rem;
    }

    .demo-credentials-title {
        font-weight: 700;
        color: #343a40;
        margin-bottom: 8px;
    }

    .demo-credentials p {
        margin: 0 0 5px;
        line-height: 1.7;
    }

    .demo-credentials small {
        color: #6c757d;
        font-size: 0.78rem;
    }
</style>

</head>

<body>

<div class="login-box">

<!-- Logo -->
<img
    src="{% static 'core/logo.png' %}"
    alt="NLC Logo"
    class="logo"
>

<!-- Title -->
<h3 class="form-title">
    Login to Duty Roaster
</h3>

<!-- Messages -->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} py-2">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!-- Login Form -->
<form method="POST" novalidate>

    {% csrf_token %}

    <div class="mb-3">
        <label for="hr_number">
            HR Number
        </label>

        <input
            type="text"
            name="hr_number"
            id="hr_number"
            class="form-control"
            required
        >
    </div>

    <div class="mb-3">
        <label for="password">
            Password
        </label>

        <input
            type="password"
            name="password"
            id="password"
            class="form-control"
            required
        >
    </div>

    <button
        type="submit"
        class="btn btn-custom w-100"
    >
        Login
    </button>

</form>

<!-- Demo Credentials -->
<div class="demo-credentials">

    <div class="demo-credentials-title">
        Demo Credentials
    </div>

    <p>
        <strong>HR Number:</strong> HR001<br>
        <strong>Password:</strong> admin123
    </p>

    <small>
        For demonstration purposes only.
    </small>

</div>


</div>

</body>
</html>
